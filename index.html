<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
*{box-sizing:border-box}

/* Layout: én kolonne, telefon-først. Ét kort ad gangen, som et kort der sendes rundt om bordet. */
:root{
  --bg:#f3f1ee; --surface:#ffffff; --ink:#1d1a24; --muted:#6c6573; --line:#e2ddd8;
  --red:#c8102e; --red-ink:#ffffff; --red-soft:#fbe4e7; --spy:#2b2540;
  --display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16131d; --surface:#211d2b; --ink:#f2eef6; --muted:#a59fb0; --line:#332d40;
  --red:#ef3b52; --red-ink:#ffffff; --red-soft:#3a1d27; --spy:#0d0b12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16131d; --surface:#211d2b; --ink:#f2eef6; --muted:#a59fb0; --line:#332d40;
  --red:#ef3b52; --red-ink:#ffffff; --red-soft:#3a1d27; --spy:#0d0b12; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:460px;margin:0 auto;padding-block:20px 40px;display:flex;flex-direction:column;gap:20px;min-height:100%;box-sizing:border-box}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.05}
.brand{display:flex;align-items:center;gap:10px}
.flag{width:34px;height:24px;border-radius:4px;background:
  linear-gradient(var(--red-ink),var(--red-ink)) 11px 0/5px 100% no-repeat,
  linear-gradient(var(--red-ink),var(--red-ink)) 0 10px/100% 4px no-repeat,var(--red);flex:none}
.brand h1{font-size:1.5rem;font-weight:800;letter-spacing:-.01em}
.brand h1 span{color:var(--red)}
.label{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.section{display:flex;flex-direction:column;gap:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}

.players{display:flex;flex-direction:column;gap:8px}
.player{display:flex;gap:8px;align-items:center}
.player .num{width:24px;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700;text-align:right;flex:none}
input[type=text]{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input[type=text]:focus{outline:2px solid var(--red);outline-offset:1px}
.icon-btn{width:40px;height:40px;flex:none;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:1.2rem;cursor:pointer}
.icon-btn:hover{color:var(--red);border-color:var(--red)}

.stepper{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stepper .ctrl{display:flex;align-items:center;gap:10px}
.stepper output{font-family:var(--display);font-weight:800;font-size:1.4rem;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.row-text{display:flex;flex-direction:column;min-width:0}
.row-text small{color:var(--muted)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-weight:500;font-size:.9rem;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.qa{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.qa.on{background:var(--red-soft);border-color:var(--red)}
.qa-name{display:flex;align-items:center;gap:8px;padding:7px 4px 7px 12px;cursor:pointer;font-weight:500;font-size:.95rem}
.qa-name input{width:18px;height:18px;margin:0;accent-color:var(--red);cursor:pointer}
.qa-x{border:0;background:transparent;color:var(--muted);font-size:1.05rem;padding:6px 12px 6px 6px;cursor:pointer}
.qa-x:hover{color:var(--red)}
.qa-x:focus-visible,.qa-name input:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.hint-text{color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--red-ink)}

.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer}
.switch{appearance:none;width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch:checked{background:var(--red)}
.switch:checked::after{transform:translateX(20px)}
.switch:focus-visible,.chip:focus-visible,.btn:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--red);outline-offset:2px}

.btn{font:inherit;font-weight:700;font-size:1.05rem;border:0;border-radius:14px;padding:16px 20px;cursor:pointer;width:100%}
.btn.primary{background:var(--red);color:var(--red-ink)}
.btn.primary:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{width:auto;padding:10px 14px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.error{color:var(--red);font-weight:500;font-size:.9rem;margin:0}

/* Spilskærme */
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px;text-align:center}
.progress{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.progress i{width:18px;height:6px;border-radius:3px;background:var(--line)}
.progress i.done{background:var(--red)}
.handoff .big{font-size:clamp(2.4rem,11vw,3.4rem);font-weight:800;letter-spacing:-.02em;word-break:break-word}
.card{position:relative;border-radius:22px;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:28px 20px;border:0;font:inherit;color:inherit;width:100%;cursor:pointer;overflow:hidden}
.card.cover{background:var(--surface);border:2px dashed var(--line)}
.card.cover .eye{width:64px;height:64px;border-radius:50%;background:var(--red-soft);display:grid;place-items:center}
.card.word{background:var(--red);color:var(--red-ink);cursor:default}
.card.spy{background:var(--spy);color:#f2eef6;cursor:default}
.card .kicker{font-size:.8rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.card .secret{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,10vw,3rem);line-height:1.05;word-break:break-word}
.card .note{font-size:.95rem;opacity:.9;max-width:28ch}
.card.spy .secret{color:#ff5a6e}
@keyframes flip{from{transform:rotateX(70deg);opacity:0}to{transform:none;opacity:1}}
.card.word,.card.spy{animation:flip .35s ease-out}

.timer{font-family:var(--display);font-weight:800;font-size:clamp(4rem,22vw,6rem);font-variant-numeric:tabular-nums;line-height:1}
.timer.low{color:var(--red)}
.starter{background:var(--red-soft);border-radius:14px;padding:14px;font-size:1rem}
.starter b{color:var(--red)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 140px}
.reveal-list{display:flex;flex-direction:column;gap:8px}
.reveal-list .who{font-family:var(--display);font-weight:800;font-size:2rem;color:var(--red)}
.rules{font-size:.92rem;color:var(--muted);margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}
.confirm{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{font:inherit;color:var(--ink);text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;cursor:pointer;min-width:0}
.seg button b{font-family:var(--display);font-size:1.15rem}
.seg button small{color:var(--muted);font-size:.82rem;line-height:1.35}
.seg button[aria-checked="true"]{border-color:var(--red);background:var(--red-soft);box-shadow:inset 0 0 0 1px var(--red)}
.seg button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.card.q .secret{font-size:clamp(1.4rem,6.2vw,1.85rem);line-height:1.18;text-wrap:balance}
.card.compact{min-height:0;padding:20px}
.answer{display:flex;flex-direction:column;gap:6px;text-align:left}
.answer input{font-size:1.1rem;padding:14px}
.answers{display:flex;flex-direction:column;gap:8px;text-align:left}
.ans{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.ans .who-s{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ans .a{font-size:1.1rem;font-weight:500;overflow-wrap:anywhere}
.ans.imp{border-color:var(--red);background:var(--red-soft)}
.ans.imp .who-s{color:var(--red)}
.sub{margin:0;color:var(--muted)}
.troll{display:flex;flex-direction:column;gap:6px;align-items:center}
.troll .who{font-family:var(--display);font-weight:800;font-size:2.2rem;color:var(--red);animation:wobble .6s ease-in-out 2}
@keyframes wobble{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.brand{flex-wrap:wrap}
.join-btn{margin-left:auto}
.sub-label{font-size:.8rem;font-weight:700;color:var(--muted);margin-top:4px}
.num.tag{width:auto;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--red)}
.code-row{display:flex;gap:14px;align-items:center;justify-content:space-between}
.code-row .row-text{gap:4px}
.code{font-family:var(--display);font-weight:800;font-size:2.6rem;letter-spacing:.12em;line-height:1;color:var(--red)}
.qr{width:132px;height:132px;flex:none;background:#fff;border-radius:10px;padding:4px}
.qr svg{width:100%;height:100%;display:block}
.qr svg rect[fill="#ffffff"],.qr svg path{shape-rendering:crispEdges}
.link-row{display:flex;gap:8px}
.link-row input{font-size:.85rem;color:var(--muted)}
.party-status,.conn-banner{display:flex;align-items:center;gap:10px;color:var(--muted)}
.conn-banner{display:flex;flex-direction:column;align-items:stretch;gap:8px;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:.95rem}
.conn-banner.err{background:var(--red-soft);border-color:var(--red)}
.conn-line{display:flex;gap:10px;align-items:flex-start}
.conn-banner .btn{align-self:flex-start}
.warn{width:20px;height:20px;border-radius:50%;background:var(--red);color:var(--red-ink);font-weight:800;display:grid;place-items:center;flex:none;font-size:.8rem}
.cdetail{color:var(--muted);font-size:.75rem}
.cdetail:empty{display:none}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--red);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.remotes{display:flex;flex-direction:column;gap:6px}
.remote{display:flex;align-items:center;gap:10px}
.remote .rname{flex:1;min-width:0;font-weight:500;overflow-wrap:anywhere}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.dot.on{background:#2e9e5b}
.status-list{display:flex;flex-direction:column;gap:6px;text-align:left}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.srow span:first-child{font-weight:500;min-width:0;overflow-wrap:anywhere}
.badge{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.srow.ok .badge{color:#2e9e5b}
.wait-h{font-size:1.6rem}
.remote-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.panel.join{text-align:left}
.code-input{text-transform:uppercase;letter-spacing:.3em;font-family:var(--display);font-weight:800;font-size:1.6rem!important;text-align:center}
@media (max-width:380px){.code-row{flex-direction:column;align-items:flex-start}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

}
function pickFresh(keys, mode){
  let free = keys.filter(k=>!recent[mode].includes(k));
  if(!free.length){recent[mode]=[];free=keys}
  const k = pick(free); recent[mode].push(k);
  if(recent[mode].length>Math.floor(keys.length*0.7)) recent[mode].shift();
  return k;
}

/* Party-panelet og listen over telefoner opdateres for sig, så man ikke mister fokus i et tekstfelt */
const partyLink = () => location.origin + location.pathname + "?party=" + party.code;
function partyPanelHTML(){
  if(!party || party.status==="connecting") return `<div class="party-status"><span class="spinner" aria-hidden="true"></span>Opretter party …</div>`;
  if(party.status==="error") return `<p class="error">${esc(party.err)}</p><button class="btn ghost small" id="retry">Prøv igen</button>`;
  return `<div class="code-row">
      <div class="row-text"><small class="hint-text">Party-kode</small><div class="code">${esc(party.code)}</div>
        <small class="hint-text">Scan QR-koden, eller åbn appen, tryk "Deltag i party" og skriv koden.</small></div>
      <div class="qr" id="qr" aria-label="QR-kode til partyet"></div></div>
    <div class="link-row"><input type="text" readonly id="plink" value="${esc(partyLink())}" aria-label="Link til partyet"><button class="btn ghost small" id="copy">Kopiér link</button></div>`;
}
function bindPartyPanel(){
  const r=app.querySelector("#retry"); if(r) r.onclick=()=>{party.status="connecting";refreshLobby();startHosting()};
  const c=app.querySelector("#copy"), inp=app.querySelector("#plink");
  if(c) c.onclick=()=>{navigator.clipboard?.writeText(inp.value).then(()=>{c.textContent="Kopieret"},()=>{inp.select()}) ?? inp.select()};
  const q=app.querySelector("#qr");
  if(q) loadScript(QR_URL).then(()=>{if(!q.isConnected||q.dataset.done)return;const qr=qrcode(0,"M");qr.addData(partyLink());qr.make();q.innerHTML=qr.createSvgTag({cellSize:4,margin:2,scalable:true});q.dataset.done="1"}).catch(()=>{});
}
function remotesHTML(){
  const list=remoteList();
  if(!list.length) return `<small class="hint-text">Ingen endnu. Del koden ovenfor.</small>`;
  return list.map(r=>`<div class="remote"><span class="dot ${r.connected?"on":""}" aria-hidden="true"></span>
    <span class="rname">${esc(r.name)}</span><small class="hint-text">${r.connected?"Forbundet":"Afbrudt"}</small>
    <button class="icon-btn" data-kick="${esc(r.id)}" aria-label="Fjern ${esc(r.name)}">×</button></div>`).join("");
}
function bindRemotes(){
  app.querySelectorAll("[data-kick]").forEach(b=>b.onclick=()=>{const r=party&&party.remotes.get(b.dataset.kick);if(!r)return;
    send(r,{t:"kicked"});setTimeout(()=>{try{r.conn&&r.conn.close()}catch(e){}},300);party.remotes.delete(r.id);refreshLobby();broadcast()});
}
function refreshLobby(){
  if(remote||joinView||game||!isParty()) return;
  const a=document.activeElement;
  if(a&&a.matches&&a.matches("input[type=text]")&&app.contains(a)){
    const pp=app.querySelector("#partyPanel"); if(pp){pp.innerHTML=partyPanelHTML();bindPartyPanel()}
    const rl=app.querySelector("#remotes"); if(rl){rl.innerHTML=remotesHTML();bindRemotes()}
    const t=totalPlayers(); app.querySelector("#pcount").textContent=`Spillere · ${t}`;
    app.querySelector("#impInfo").textContent=`Max ${maxImp(t)} med ${t} spillere`;
  } else renderSetup();
}

/* ---------- Vært: forbindelser ---------- */
function startHosting(){
  if(party && (party.peer || party.starting)) return;
  party = party || {remotes:new Map(), status:"connecting", err:"", code:settings.partyCode||newCode(), tries:0};
  party.starting = true;
  loadScript(PEER_URL).then(()=>{
    if(!party) return;
    const peer = new Peer(peerId(party.code), peerOpts());
    party.peer = peer; party.starting = false;
    peer.on("open",()=>{if(party?.peer!==peer)return;party.status="ready";party.tries=0;settings.partyCode=party.code;save();keepAwake();refreshLobby()});
    peer.on("connection",conn=>hostConn(conn));
    peer.on("disconnected",()=>{if(party?.peer===peer&&!game){party.status="connecting";refreshLobby()}
      setTimeout(()=>{if(party?.peer===peer&&!peer.destroyed&&peer.disconnected){try{peer.reconnect()}catch(e){}}},1500)});
    peer.on("error",err=>{
      if(party?.peer!==peer) return;
      if(err.type==="peer-unavailable") return;
      peer.destroy(); party.peer=null;
      if(err.type==="unavailable-id"){ if(++party.tries>3){party.code=newCode();party.tries=0} setTimeout(startHosting,2500); return }
      party.status="error"; party.err="Kunne ikke oprette forbindelse til party-serveren. Tjek internettet og prøv igen.";
      refreshLobby(); setTimeout(()=>{if(party&&!party.peer&&!party.starting)startHosting()},5000);
    });
  }).catch(()=>{if(!party)return;party.starting=false;party.status="error";party.err="Party kræver internet første gang. Tjek forbindelsen og prøv igen.";refreshLobby()});
}
function stopHosting(){
  if(!party) return;
  for(const r of party.remotes.values()){send(r,{t:"kicked",ended:true});try{r.conn&&r.conn.close()}catch(e){}}
  try{party.peer&&party.peer.destroy()}catch(e){}
  party=null; wakeLock?.release?.();
}
function uniqueName(name,id){
  const taken=new Set([settings.hostName,...settings.guests,...remoteList().filter(r=>r.id!==id).map(r=>r.name)].map(n=>String(n).trim().toLowerCase()));
  let n=name,i=2; while(taken.has(n.toLowerCase())) n=`${name} ${i++}`; return n;
}
function hostConn(conn){
  conn.on("data",msg=>{
    if(!party||!msg||typeof msg!=="object") return;
    if(msg.t==="hello"){
      const id=String(msg.id||"").slice(0,40); if(!id) return;
      let r=party.remotes.get(id);
      if(!r){r={id,name:uniqueName(String(msg.name||"").trim().slice(0,20)||"Spiller",id)};party.remotes.set(id,r)}
      else if(r.conn&&r.conn!==conn){try{r.conn.close()}catch(e){}}
      r.conn=conn; r.connected=true; conn._rid=id;
      syncRemote(r); onPartyChange();
    } else if(conn._rid){ const r=party.remotes.get(conn._rid); if(r&&r.conn===conn) handleRemoteMsg(r,msg) }
  });
  conn.on("close",()=>{const r=conn._rid&&party&&party.remotes.get(conn._rid);if(r&&r.conn===conn){r.connected=false;r.conn=null;onPartyChange()}});
  conn.on("error",()=>{});
}
function send(r,msg){if(r&&r.conn&&r.conn.open){try{r.conn.send(msg)}catch(e){}}}
function onPartyChange(){
  if(!game){refreshLobby();broadcast();return}
  if(game.phase==="waiting") render(); else broadcast();
}
const gameIdx = r => game&&game.party ? game.players.findIndex(p=>p.rid===r.id) : -1;
function syncRemote(r){
  const idx=gameIdx(r);
  if(idx<0){send(r,{t:"lobby",name:r.name,players:lobbyNames(),inGame:!!game});return}
  send(r,{t:"round",round:game.id,name:r.name,card:cardFor(idx),done:!!game.done[idx]});
  send(r,{t:"pub",pub:pubState()});
}
function broadcast(){if(party) for(const r of party.remotes.values()) syncRemote(r)}
const lobbyNames = () => [settings.hostName.trim()||"Værten",...remoteList().filter(r=>r.connected).map(r=>r.name),...settings.guests.map(g=>g.trim()).filter(Boolean)];
function handleRemoteMsg(r,msg){
  const idx=gameIdx(r);
  if(idx<0||msg.round!==game.id||game.done[idx]) return;
  if(msg.t==="answer"&&game.mode==="spg"){game.answers[idx]=String(msg.text||"").trim().slice(0,80)||"–";game.done[idx]=true}
  else if(msg.t==="ready"&&game.mode==="ord"){game.done[idx]=true}
  else return;
  if(game.phase==="waiting"&&game.done.every(Boolean)) game.phase="discuss";
  if(game.phase==="waiting"||game.phase==="discuss") render(); else broadcast();
}

/* ---------- Ny runde ---------- */
function startGame(){
  let players;
  if(isParty()){
    const host=settings.hostName.trim();
    if(!host) return renderSetup("Skriv dit eget navn under Spillere.");
    remember(settings.guests);
    players=[{name:host,kind:"host"},
      ...remoteList().filter(r=>r.connected).map(r=>({name:r.name,kind:"remote",rid:r.id})),
      ...settings.guests.map((n,i)=>({name:n.trim()||`Gæst ${i+1}`,kind:"guest"}))];
  } else {
    remember(settings.players);
    players=settings.players.map((n,i)=>({name:n.trim()||`Spiller ${i+1}`,kind:"local"}));
  }
  if(players.length<3) return renderSetup(isParty()?"I skal være mindst 3 spillere. Vent på at flere tilslutter sig, eller tilføj gæster.":"I skal være mindst 3 spillere.");
  if(new Set(players.map(p=>p.name.toLowerCase())).size!==players.length) return renderSetup("To spillere har samme navn. Giv dem forskellige navne.");
  const nImp = Math.min(settings.imposters,maxImp(players.length));
  const troll = settings.troll && Math.random() < 1/12;
  const imps = troll ? players.map((_,i)=>i) : shuffle(players.map((_,i)=>i)).slice(0,nImp);
  const local = players.map((p,i)=>p.kind==="remote"?-1:i).filter(i=>i>=0);
  const base = {id:Date.now().toString(36),party:isParty(),players,imps,nImp,troll,local,pos:0,phase:"handoff",starter:pick(players).name,
                confirmEnd:false,done:players.map(()=>false)};
  if(settings.mode==="spg"){
    const pool = {s:SPORGSMAAL, f:settings.freaky?FREAKY:[]};
    const key = pickFresh([...pool.s.map((_,i)=>"s"+i),...pool.f.map((_,i)=>"f"+i)],"spg");
    const [real,fake] = pool[key[0]][+key.slice(1)];
    game = {...base,mode:"spg",real,fake,inApp:isParty()||settings.inApp,answers:players.map(()=>""),qShown:false};
  } else {
    const cats = Object.keys(KATEGORIER).filter(k=>!settings.off.includes(k));
    if(!cats.length) return renderSetup("Vælg mindst én kategori.");
    const [cat,entry] = pickFresh(cats.flatMap(c=>KATEGORIER[c].map(w=>c+"|"+w)),"ord").split("|");
    const [word,hint] = entry.split(":");
    game = {...base,mode:"ord",cat,word,hint,hintOn:settings.hint};
  }
  render();
}
function cardFor(idx){
  const imp=game.imps.includes(idx), n=game.nImp??game.imps.length;
  if(game.mode==="spg") return {kind:"q",q:imp?game.fake:game.real};
  return imp?{kind:"spy",hint:game.hintOn?game.hint:"",n}:{kind:"word",word:game.word,cat:game.cat,n};
}
function pubState(){
  const phase = ["handoff","reveal","waiting"].includes(game.phase) ? "waiting" : game.phase;
  const pub = {mode:game.mode,phase,players:game.players.map((p,i)=>({name:p.name,done:!!game.done[i]}))};
  if(phase==="discuss"||phase==="result"){
    pub.starter=game.starter; pub.inApp=game.inApp;
    if(game.mode==="spg"){pub.answers=game.answers;pub.qShown=game.qShown||phase==="result";if(pub.qShown)pub.real=game.real}
  }
  if(phase==="result"){
    pub.imps=game.imps; pub.troll=game.troll;
    if(game.mode==="spg") pub.fake=game.fake; else {pub.word=game.word;pub.cat=game.cat}
  }
  return pub;
}

/* ---------- Send rundt (telefonen der holdes i hånden) ---------- */
const cur = () => game.local[game.pos];
const progress = () => game.local.length<2 ? "" : `<div class="progress" aria-label="${game.pos+1} af ${game.local.length}">${game.local.map((_,i)=>`<i class="${i<game.pos?"done":""}"></i>`).join("")}</div>`;
const isLast = () => game.pos===game.local.length-1;
function advance(){
  game.done[cur()]=true;
  if(isLast()) game.phase = game.done.every(Boolean) ? "discuss" : "waiting";
  else {game.pos++;game.phase="handoff"}
  render();
}
const peekCard = (label) => `<button class="card cover" id="peek">
      <div class="eye" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--red)"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></div>
      <b>${label}</b>
      <span style="color:var(--muted);font-size:.9rem">Sørg for at ingen andre kigger med</span>
    </button>`;

function renderHandoff(){
  const p = game.players[cur()];
  app.innerHTML = `<div class="stage handoff">
    ${progress()}
    <div class="label">${p.kind==="host"?"Dit kort":"Giv telefonen til"}</div>
    <div class="big">${esc(p.name)}</div>
    ${peekCard(game.mode==="spg"?"Tryk for at se dit spørgsmål":"Tryk for at se din rolle")}
    ${quitBtn()}
  </div>`;
  app.querySelector("#peek").onclick=()=>{game.phase="reveal";render()};
  bindQuit();
}

function cardHTML(c){
  const others = c.n>1 ? `<span class="note">Der er ${c.n} imposters i spillet.</span>` : "";
  if(c.kind==="q") return `<div class="card word q"><span class="kicker">Dit spørgsmål</span><span class="secret">${esc(c.q)}</span>${c.note||""}</div>`;
  if(c.kind==="spy") return `<div class="card spy"><span class="kicker">Du er</span><span class="secret">Imposteren</span>
        ${c.hint?`<span class="note">Dit stikord: <b>${esc(c.hint)}</b></span>`:""}
        <span class="note">Lad som om du kender ordet.</span>${others}</div>`;
  return `<div class="card word"><span class="kicker">${esc(c.cat)}</span><span class="secret">${esc(c.word)}</span>
        <span class="note">Find den, der ikke kender ordet.</span>${others}</div>`;
}
const answerField = () => `<label class="answer" for="ans"><span class="label">Dit svar</span>
      <input type="text" id="ans" maxlength="80" autocomplete="off" placeholder="Skriv dit svar her"></label>`;

function renderReveal(){
  const idx = cur(), c = cardFor(idx), spg = game.mode==="spg";
  const toWait = isLast() && game.party && !game.done.every((d,i)=>d||i===idx);
  let label;
  if(spg && game.inApp) label = !isLast()?"Gem svar og giv videre":toWait?"Gem svar":"Gem svar og se svarene";
  else if(spg) label = isLast()?"Skjul og læs svarene op":"Skjul og giv videre";
  else label = isLast()?(toWait?"Skjul kortet":"Skjul og start diskussionen"):"Skjul og giv videre";
  if(spg && !game.inApp) c.note=`<span class="note">Skriv dit svar ned, fx i Noter. Vis det ikke til nogen endnu.</span>`;
  app.innerHTML = `<div class="stage">${progress()}<div class="label">${esc(game.players[idx].name)}</div>${cardHTML(c)}
    ${spg&&game.inApp?answerField():""}
    <button class="btn primary" id="next" ${spg&&game.inApp?"disabled":""}>${label}</button></div>`;
  const next = app.querySelector("#next"), ans = app.querySelector("#ans");
  if(ans){
    ans.oninput=()=>{next.disabled=!ans.value.trim()};
    ans.onkeydown=e=>{if(e.key==="Enter"&&ans.value.trim())next.click()};
  }
  next.onclick=()=>{if(ans)game.answers[idx]=ans.value.trim();advance()};
}

const statusList = players => `<div class="status-list">${players.map(p=>`<div class="srow ${p.done?"ok":""}"><span>${esc(p.name)}</span><span class="badge">${p.done?"Klar":"Venter"}</span></div>`).join("")}</div>`;
function renderWaiting(){
  const left = game.done.filter(d=>!d).length;
  app.innerHTML = `<div class="stage">
    <div class="label">Venter på ${left} ${left===1?"spiller":"spillere"}</div>
    <h2 class="wait-h">${game.mode==="spg"?"De andre skriver deres svar":"De andre kigger på deres kort"}</h2>
    ${statusList(game.players.map((p,i)=>({name:p.name,done:game.done[i]})))}
    <button class="btn ghost" id="skip">Fortsæt uden at vente</button>
    ${quitBtn()}
  </div>`;
  app.querySelector("#skip").onclick=()=>{game.phase="discuss";render()};
  bindQuit();
}

/* ---------- Diskussion ---------- */
const confirmBox = () => `<div id="confirm" ${game.confirmEnd?"":"hidden"} class="confirm"><span>Har I stemt? Svaret bliver vist for alle.</span>
      <div class="btn-row"><button class="btn ghost" id="no">Ikke endnu</button><button class="btn primary" id="yes">Vis svaret</button></div></div>`;
function bindConfirm(){
  app.querySelector("#end").onclick=()=>{game.confirmEnd=true;app.querySelector("#confirm").hidden=false};
  app.querySelector("#no").onclick=()=>{game.confirmEnd=false;app.querySelector("#confirm").hidden=true};
  app.querySelector("#yes").onclick=()=>{game.phase="result";render()};
}
const answersHTML = (names,answers,imps) => `<div class="answers">${names.map((n,i)=>{const imp=imps&&imps.includes(i);return `
  <div class="ans ${imp?"imp":""}"><span class="who-s">${esc(n)}${imp?" · imposter":""}</span><span class="a">${esc(answers[i]||"–")}</span></div>`}).join("")}</div>`;
const pnames = () => game.players.map(p=>p.name);

function renderDiscuss(){
  if(game.mode==="spg") return renderAnswers();
  app.innerHTML = `<div class="stage">
    <div class="label">Diskutér og stem</div>
    <div class="starter"><b>${esc(game.starter)}</b> starter. Gå på omgang og sig ét ord hver, der passer til det hemmelige ord.</div>
    <button class="btn primary" id="end">Afslør imposteren</button>
    ${confirmBox()}
    ${quitBtn()}
  </div>`;
  bindConfirm(); bindQuit();
}

function renderAnswers(){
  const answers = game.inApp ? answersHTML(pnames(),game.answers)
    : `<div class="starter"><b>${esc(game.starter)}</b> starter. Læs jeres svar højt én ad gangen.</div>`;
  app.innerHTML = `<div class="stage">
    ${game.qShown?`
      <div class="card word q compact"><span class="kicker">Det rigtige spørgsmål</span><span class="secret">${esc(game.real)}</span></div>
      ${answers}
      <p class="sub">Hvem har svaret på et andet spørgsmål? Diskutér og stem.</p>
      <button class="btn primary" id="end">Afslør imposter</button>
      ${confirmBox()}`
    :`
      <div class="label">${game.inApp?"Svarene":"Læs svarene op"}</div>
      ${answers}
      <button class="btn primary" id="showQ">Afslør rigtige spørgsmål</button>`}
    ${quitBtn()}
  </div>`;
  if(game.qShown) bindConfirm();
  else app.querySelector("#showQ").onclick=()=>{game.qShown=true;render()};
  bindQuit();
}

/* ---------- Resultat ---------- */
function resultHTML(mode,names,imps,d){
  const impNames = imps.map(i=>names[i]);
  const reveal = mode==="spg"
    ? `<div class="card spy q compact"><span class="kicker">${d.troll?"Alles":impNames.length>1?"Imposternes":"Imposterens"} spørgsmål</span><span class="secret">${esc(d.fake)}</span></div>
       <div class="card word q compact"><span class="kicker">Det rigtige spørgsmål${d.troll?", som ingen fik":""}</span><span class="secret">${esc(d.real)}</span></div>
       ${d.inApp?answersHTML(names,d.answers,imps):""}`
    : `<div class="card word" style="min-height:180px"><span class="kicker">Det hemmelige ord${d.troll?", som ingen fik":""}</span><span class="secret">${esc(d.word)}</span><span class="note">${esc(d.cat)}</span></div>`;
  if(d.troll) return `<div class="troll"><div class="label">Troll-runde</div><div class="who">I blev trollet!</div>
      <p class="sub">Alle ${names.length} var imposters. Der var ingen at finde.</p></div>${reveal}`;
  return `<div class="label">${impNames.length>1?"Imposterne var":"Imposteren var"}</div>
    <div class="reveal-list">${impNames.map(n=>`<div class="who">${esc(n)}</div>`).join("")}</div>${reveal}`;
}
function renderResult(){
  app.innerHTML = `<div class="stage">${resultHTML(game.mode,pnames(),game.imps,game)}
    <div class="btn-row"><button class="btn ghost" id="setup">Ret spillere</button><button class="btn primary" id="again">Spil igen</button></div>
  </div>`;
  app.querySelector("#again").onclick=startGame;
  app.querySelector("#setup").onclick=()=>{game=null;render()};
}

/* ---------- Deltag i en andens party ---------- */
function renderJoin(){
  app.innerHTML = `
    <header class="brand"><div class="flag" aria-hidden="true"></div><h1>Hvem er <span>Imposteren?</span></h1></header>
    <div class="stage">
      <h2 class="wait-h">Deltag i party</h2>
      <div class="panel join">
        <label class="answer" for="jname"><span class="label">Dit navn</span>
          <input type="text" id="jname" maxlength="20" autocomplete="off" value="${esc(settings.myName)}" placeholder="Fx Freja"></label>
        <label class="answer" for="jcode"><span class="label">Party-kode</span>
          <input type="text" id="jcode" class="code-input" maxlength="4" autocomplete="off" autocapitalize="characters" value="${esc(joinView.code)}" placeholder="ABCD"></label>
        ${joinView.err?`<p class="error">${esc(joinView.err)}</p>`:""}
        <button class="btn primary" id="join">Deltag</button>
      </div>
      <button class="btn ghost small" id="back" style="align-self:center">Tilbage</button>
    </div>`;
  const nm=app.querySelector("#jname"), cd=app.querySelector("#jcode");
  cd.oninput=()=>{cd.value=cd.value.toUpperCase().replace(/[^A-Z0-9]/g,"");joinView.code=cd.value};
  nm.oninput=()=>{settings.myName=nm.value;save()};
  const go=()=>{
    const name=nm.value.trim(), code=cd.value.trim().toUpperCase();
    if(!name){joinView.err="Skriv dit navn.";return renderJoin()}
    if(code.length!==4){joinView.err="Party-koden har 4 tegn. Du finder den på værtens telefon.";return renderJoin()}
    settings.myName=name; save(); joinView=null;
    remote={code,name,status:"connecting",lobby:null,card:null,pub:null,round:null,done:false,revealed:false,draft:""};
    render(); connectRemote();
  };
  app.querySelector("#join").onclick=go;
  cd.onkeydown=e=>{if(e.key==="Enter")go()};
  app.querySelector("#back").onclick=()=>{joinView=null;clearUrl();render()};
  if(!nm.value) nm.focus(); else if(!cd.value) cd.focus();
}
function clearUrl(){try{history.replaceState(null,"",location.pathname)}catch(e){}}

function setStatus(me,status,detail){if(remote!==me)return;me.status=status;if(detail!==undefined)me.detail=detail;renderRemote()}
function connectRemote(){
  const me=remote; if(!me) return;
  clearTimeout(me.retryT); me.retryT=null;
  if(me.status!=="reconnecting") setStatus(me,"server","");
  loadScript(PEER_URL).then(()=>{
    if(remote!==me) return;
    if(me.peer&&!me.peer.destroyed&&me.peer.open) return openConn(me);
    try{me.peer&&me.peer.destroy()}catch(e){}
    const peer=new Peer(peerOpts()); me.peer=peer;
    const openT=setTimeout(()=>{if(remote===me&&me.peer===peer&&!peer.open){try{peer.destroy()}catch(e){};me.peer=null;
      setStatus(me,"offline","Ingen svar fra forbindelsesserveren efter 12 sek.");retryLater(me,5000)}},12000);
    peer.on("open",()=>{clearTimeout(openT);if(remote===me&&me.peer===peer)openConn(me)});
    peer.on("disconnected",()=>{setTimeout(()=>{if(remote===me&&me.peer===peer&&!peer.destroyed&&peer.disconnected){try{peer.reconnect()}catch(e){}}},1500)});
    peer.on("error",err=>{
      if(remote!==me||me.peer!==peer) return;
      clearTimeout(openT);
      if(err.type==="peer-unavailable"){
        if(me.conn){try{me.conn.close()}catch(e){};me.conn=null}
        setStatus(me,"notfound","peer-unavailable"); retryLater(me,4000); return;
      }
      try{peer.destroy()}catch(e){}; me.peer=null;
      setStatus(me,"offline",err.type||String(err)); retryLater(me,5000);
    });
  }).catch(()=>{setStatus(me,"offline","Kunne ikke hente party-funktionen");retryLater(me,5000)});
}
function openConn(me){
  if(remote!==me) return;
  if(me.conn){try{me.conn.close()}catch(e){}}
  if(me.status!=="reconnecting") setStatus(me,"dialing","");
  const conn=me.peer.connect(peerId(me.code),{reliable:true});
  me.conn=conn;
  const start=Date.now();
  const watch=setInterval(()=>{
    if(remote!==me||me.conn!==conn||conn.open){clearInterval(watch);return}
    const pc=conn.peerConnection, ice=pc?pc.iceConnectionState:"–", st=pc?pc.connectionState:"–";
    const secs=Math.round((Date.now()-start)/1000);
    if(ice==="failed"||st==="failed"||secs>=25){
      clearInterval(watch); try{conn.close()}catch(e){}; me.conn=null;
      setStatus(me,"blocked",`ice=${ice}, forbindelse=${st}, ${secs} sek.`); return;
    }
    if(secs>=3&&me.status!=="ice"&&me.status!=="reconnecting") setStatus(me,"ice",`ice=${ice}`);
    else if(me.status==="ice") {me.detail=`ice=${ice}, ${secs} sek.`; const d=app.querySelector("#cdetail"); if(d) d.textContent=me.detail}
  },1000);
  conn.on("open",()=>{if(remote!==me||me.conn!==conn)return;clearInterval(watch);conn.send({t:"hello",id:settings.clientId,name:me.name});keepAwake();setStatus(me,"connected","")});
  conn.on("data",msg=>{if(remote===me&&me.conn===conn)onHostMsg(msg)});
  conn.on("close",()=>{if(remote===me&&me.conn===conn&&!me.kicked){clearInterval(watch);me.conn=null;setStatus(me,"reconnecting","");retryLater(me,1500)}});
  conn.on("error",()=>{});
}
function retryLater(me,ms){
  if(me.retryT||me.kicked) return;
  me.retryT=setTimeout(()=>{me.retryT=null;if(remote===me&&me.status!=="connected")connectRemote()},ms||3000);
}
function onHostMsg(msg){
  if(!msg||typeof msg!=="object") return;
  const me=remote;
  if(msg.t==="lobby"){me.lobby=msg;me.round=null;me.card=null;me.pub=null;me.name=msg.name||me.name}
  else if(msg.t==="round"){
    if(msg.round!==me.round){me.round=msg.round;me.revealed=false;me.draft="";me.viewCard=false}
    me.card=msg.card; me.done=msg.done; me.name=msg.name||me.name;
  }
  else if(msg.t==="pub"){me.pub=msg.pub}
  else if(msg.t==="kicked"){me.kicked=msg.ended?"ended":"kicked";try{me.peer&&me.peer.destroy()}catch(e){}}
  renderRemote();
}
function leaveParty(){
  if(remote){clearTimeout(remote.retryT);try{remote.peer&&remote.peer.destroy()}catch(e){}}
  remote=null; clearUrl(); wakeLock?.release?.(); render();
}

let lastRemoteHTML="";
function renderRemote(){
  const me=remote; if(!me) return;
  const MSG = {
    server:["busy","Forbinder til serveren …"],
    dialing:["busy",`Leder efter party ${esc(me.code)} …`],
    ice:["busy","Fandt partyet. Opretter forbindelse til værtens telefon …"],
    reconnecting:["busy","Forbindelsen blev afbrudt. Genopretter …"],
    notfound:["err",`Kan ikke finde party ${esc(me.code)}. Tjek at koden er rigtig, og at værten har appen åben med skærmen tændt. Prøver igen automatisk.`],
    offline:["err","Kan ikke nå forbindelsesserveren. Tjek internettet. Prøver igen automatisk."],
    blocked:["err","Fandt partyet, men telefonerne kan ikke få forbindelse til hinanden. Det sker tit på mobildata. Prøv at komme på samme Wi-Fi som værten, og tryk Prøv igen."]
  };
  const [kind,text] = MSG[me.status]||["busy","Forbinder …"];
  const banner = me.status==="connected" ? "" : `<div class="conn-banner ${kind}">
      <div class="conn-line">${kind==="busy"?`<span class="spinner" aria-hidden="true"></span>`:`<span class="warn" aria-hidden="true">!</span>`}<span>${text}</span></div>
      ${kind==="err"?`<button class="btn ghost small" id="retryConn">Prøv igen</button>`:""}
      <small class="cdetail" id="cdetail">${esc(me.detail||"")}</small></div>`;
  const header = `<div class="remote-head"><span class="label">Party ${esc(me.code)} · ${esc(me.name)}</span><button class="btn ghost small" id="leave">Forlad</button></div>`;
  let body;
  if(me.kicked){
    body = `<div class="stage"><h2 class="wait-h">${me.kicked==="ended"?"Værten har lukket partyet":"Du er fjernet fra partyet"}</h2>
      <button class="btn primary" id="leave2">Tilbage til start</button></div>`;
  } else if(me.round && me.card && me.pub && me.viewCard){
    body = `<div class="stage">${cardHTML(me.card)}<button class="btn primary" id="hideCard">Skjul kortet</button></div>`;
  } else if(me.round && me.card && me.pub){
    const p=me.pub;
    if(p.phase==="waiting" && !me.done){
      if(!me.revealed) body = `<div class="stage">${peekCard(p.mode==="spg"?"Tryk for at se dit spørgsmål":"Tryk for at se din rolle")}</div>`;
      else body = `<div class="stage">${cardHTML(me.card)}
        ${p.mode==="spg"?answerField()+`<button class="btn primary" id="send" ${me.draft.trim()?"":"disabled"}>Send svar</button>`
                        :`<button class="btn primary" id="ready">Jeg har set mit kort</button>`}</div>`;
    } else if(p.phase==="waiting"){
      const left=p.players.filter(x=>!x.done).length;
      body = `<div class="stage"><div class="label">${left?`Venter på ${left} ${left===1?"spiller":"spillere"}`:"Alle er klar"}</div>
        <h2 class="wait-h">${p.mode==="spg"?"Dit svar er sendt":"Du er klar"}</h2>${statusList(p.players)}
        ${p.mode==="ord"?`<button class="btn ghost small" id="again-card" style="align-self:center">Se mit kort igen</button>`:""}</div>`;
    } else if(p.phase==="discuss"){
      const names=p.players.map(x=>x.name);
      body = p.mode==="spg"
        ? `<div class="stage">${p.qShown?`<div class="card word q compact"><span class="kicker">Det rigtige spørgsmål</span><span class="secret">${esc(p.real)}</span></div>`:`<div class="label">Svarene</div>`}
            ${answersHTML(names,p.answers)}
            <p class="sub">${p.qShown?"Hvem har svaret på et andet spørgsmål? Diskutér og stem.":"Værten afslører snart det rigtige spørgsmål."}</p></div>`
        : `<div class="stage"><div class="label">Diskutér og stem</div>
            <div class="starter"><b>${esc(p.starter)}</b> starter. Gå på omgang og sig ét ord hver, der passer til det hemmelige ord.</div>
            <button class="btn ghost small" id="again-card" style="align-self:center">Se mit kort igen</button></div>`;
    } else {
      body = `<div class="stage">${resultHTML(p.mode,p.players.map(x=>x.name),p.imps,p)}<p class="sub">Venter på at værten starter næste runde.</p></div>`;
    }
  } else if(me.lobby){
    body = `<div class="stage"><h2 class="wait-h">Du er med!</h2>
      <p class="sub">${me.lobby.inGame?"Runden er allerede i gang. Du kommer med i næste runde.":"Venter på at værten starter spillet."}</p>
      <div class="status-list">${me.lobby.players.map(n=>`<div class="srow ok"><span>${esc(n)}</span></div>`).join("")}</div></div>`;
  } else {
    body = `<div class="stage"><h2 class="wait-h">Forbinder til party ${esc(me.code)} …</h2></div>`;
  }
  const html = header + banner + body;
  if(html===lastRemoteHTML && app.querySelector("#leave")) return;
  lastRemoteHTML = html;
  app.innerHTML = html;
  const on=(id,fn)=>{const el=app.querySelector(id);if(el)el.onclick=fn};
  on("#leave",leaveParty); on("#leave2",leaveParty);
  on("#retryConn",()=>{try{me.peer&&me.peer.destroy()}catch(e){};me.peer=null;me.conn=null;connectRemote()});
  on("#peek",()=>{me.revealed=true;renderRemote()});
  on("#again-card",()=>{me.viewCard=true;renderRemote()});
  on("#hideCard",()=>{me.viewCard=false;renderRemote()});
  on("#ready",()=>{if(!me.conn||!me.conn.open)return;me.conn.send({t:"ready",round:me.round});me.done=true;renderRemote()});
  const ans=app.querySelector("#ans"), sendBtn=app.querySelector("#send");
  if(ans){
    ans.value=me.draft;
    ans.oninput=()=>{me.draft=ans.value;sendBtn.disabled=!ans.value.trim()};
    ans.onkeydown=e=>{if(e.key==="Enter"&&ans.value.trim())sendBtn.click()};
  }
  if(sendBtn) sendBtn.onclick=()=>{
    if(!me.conn||!me.conn.open) return;
    me.conn.send({t:"answer",round:me.round,text:me.draft.trim()}); me.done=true; renderRemote();
  };
}

const quitBtn = () => `<button class="btn ghost small" id="quit" style="align-self:center">Afbryd runden</button>`;
function bindQuit(){const q=app.querySelector("#quit");if(q)q.onclick=()=>{game=null;render()}}

document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState!=="visible") return;
  keepAwake();
  if(party&&party.peer&&party.peer.disconnected&&!party.peer.destroyed){try{party.peer.reconnect()}catch(e){}}
  if(party&&!party.peer&&!party.starting) startHosting();
  if(remote&&remote.status!=="connected"&&!remote.kicked){clearTimeout(remote.retryT);remote.retryT=null;connectRemote()}
});

const urlCode = new URLSearchParams(location.search).get("party");
if(urlCode) joinView={code:urlCode.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,4),err:""};
render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
